services:
  postgres:
    image: postgres:16-alpine
    container_name: paisadiary-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: paisadiary
      POSTGRES_USER: paisadiary
      POSTGRES_PASSWORD: paisadiary
    ports:
      - "5432:5432"
    volumes:
      - paisadiary_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paisadiary -d paisadiary"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  paisadiary_pgdata:
